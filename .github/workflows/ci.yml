name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pin to the version that generated poetry.lock. `pipx install poetry`
      # installs the latest (2.4.3), which computes the pyproject content hash
      # differently from 1.8.3 and fails with "pyproject.toml changed
      # significantly since poetry.lock was last generated" on a lock that is
      # in fact correct. That broke mash-core CI on every run from 2026-08-25.
      - name: Install poetry
        run: pipx install poetry==1.8.3

      - name: Configure poetry
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Type check (mypy)
        run: poetry run mypy mash_core

      - name: Tests (pytest)
        run: poetry run pytest -v
